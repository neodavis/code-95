<div class="file-picker">
  @if (label) {
  <p class="file-picker__label">{{ label }}</p>
  }

  <label
    class="file-picker__zone"
    [class.file-picker__zone--has-image]="displayUrl"
  >
    @if (displayUrl) {
    <img class="file-picker__preview" [src]="displayUrl" alt="preview" />
    <button
      type="button"
      class="file-picker__clear"
      (click)="clear($event)"
      title="Видалити"
    >
      &#x2715;
    </button>
    } @else {
    <span class="file-picker__icon">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
    </span>
    <span class="file-picker__hint-primary">Оберіть зображення</span>
    <span class="file-picker__hint-secondary"
      >до {{ maxSizeMb }} МБ &bull; JPEG, PNG, WEBP</span
    >
    }
    <input
      type="file"
      class="file-picker__input"
      [accept]="accept"
      (change)="onFileSelect($event)"
    />
  </label>

  @if (fileName()) {
  <p class="file-picker__filename">
    {{ fileName() }} <span class="file-picker__size">{{ sizeLabel() }}</span>
  </p>
  } @if (error()) {
  <p class="file-picker__error">{{ error() }}</p>
  }
</div>
