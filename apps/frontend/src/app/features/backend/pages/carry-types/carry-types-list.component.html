<lib-page-header [title]="'admin.carry_types' | translate">
  <a routerLink="create" class="link-black link-black_success">{{
    'action.add_carry_type' | translate
  }}</a>
</lib-page-header>

<lib-data-table
  [items]="items()"
  [loading]="loading()"
  [currentPage]="currentPage()"
  [totalPages]="totalPages()"
  [sortColumn]="sortColumn()"
  [sortOrder]="sortOrder()"
  (sortChange)="toggleSort($event)"
  (searchChange)="onSearchInput($event)"
  (pageChange)="loadPage($event)"
>
  <ng-template libColumn="name" header="table.name" [sortable]="true" let-item>
    {{ item.name }}
  </ng-template>
  <ng-template
    libColumn="nameSpk"
    header="table.name_spk"
    [sortable]="true"
    let-item
  >
    {{ item.nameSpk || '—' }}
  </ng-template>
  <ng-template
    libColumn="actions"
    header="table.actions"
    tdClass="table-actions"
    [ellipsis]="false"
    let-item
  >
    <a
      [routerLink]="[item.id, 'edit']"
      class="link-simple link-simple_primary"
      >{{ 'action.edit' | translate }}</a
    >
    <button (click)="delete(item)" class="link-simple link-simple_danger">
      {{ 'action.delete' | translate }}
    </button>
  </ng-template>
</lib-data-table>
