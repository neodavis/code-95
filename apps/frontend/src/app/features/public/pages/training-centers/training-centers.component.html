<lib-page-header [title]="'page.training_centers' | translate" />

<lib-data-table
  [items]="items()"
  [loading]="loading()"
  [currentPage]="currentPage()"
  [totalPages]="totalPages()"
  [sortColumn]="sortColumn()"
  [sortOrder]="sortOrder()"
  (sortChange)="toggleSort($event)"
  (searchChange)="onSearchInput($event)"
  (pageChange)="loadPage($event)"
>
  <ng-template libColumn="name" header="table.name" [sortable]="true" let-item>
    {{ item.name }}
  </ng-template>
  <ng-template
    libColumn="region"
    header="table.region"
    [sortable]="true"
    let-item
  >
    {{ item.region }}
  </ng-template>
  <ng-template libColumn="address" header="table.address" let-item>
    {{ item.city ? item.city + ', ' + item.addrStreet : item.addrStreet }}
  </ng-template>
  <ng-template
    libColumn="email"
    header="table.email"
    [sortable]="true"
    let-item
  >
    {{ item.email }}
  </ng-template>
  <ng-template
    libColumn="phone"
    header="table.phone"
    [sortable]="true"
    let-item
  >
    {{ item.phone }}
  </ng-template>
  <ng-template libColumn="website" header="table.website" let-item>
    @if (item.website) {
      <a [href]="item.website" target="_blank">{{ item.website }}</a>
    }
  </ng-template>
</lib-data-table>
